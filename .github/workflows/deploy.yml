name: SPOT Deploy Pipeline

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    backend-build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Code Clone
              uses: actions/checkout@v4

            - name: GitHub Container Registry Login
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Lowercase Repository Name
              run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Build and Push Backend Docker Image
              uses: docker/build-push-action@v5
              with:
                context: ./backend
                push: true
                tags: ghcr.io/${{ env.REPO_LC }}/spot-backend:latest

    frontend-build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Code Clone
              uses: actions/checkout@v4

            - name: GitHub Container Registry Login
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Lowercase Repository Name
              run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Build and Push Frontend Docker Image
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: ghcr.io/${{ env.REPO_LC }}/spot-frontend:latest

    face-recognition-build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Code Clone
              uses: actions/checkout@v4

            - name: GitHub Container Registry Login
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Lowercase Repository Name
              run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Build and Push Face Recognition Docker Image
              uses: docker/build-push-action@v5
              with:
                context: ./face_recognition
                push: true
                tags: ghcr.io/${{ env.REPO_LC }}/spot-face_recognition:latest

    deploy:
        if: github.ref == 'refs/heads/main'
        runs-on: self-hosted
        needs: [backend-build, frontend-build, face-recognition-build]
        steps:
            - name: Code Clone
              uses: actions/checkout@v4

            - name: Update docker-compose file on server
              run: cp docker-compose.prod.yml /home/runner/spot/docker-compose.yml

            - name: Update .env file on server
              run: |
                cat << EOF > /home/runner/spot/.env
                DB_USER=${{ secrets.DB_USER }}
                DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                DB_NAME=${{ secrets.DB_NAME }}
                KAFKA_CLUSTER_ID=${{ secrets.KAFKA_CLUSTER_ID }}
                EOF

            - name: Deploy to Server
              run: |
                cd /home/runner/spot
                docker compose pull
                docker compose up -d

            - name: Clean Up Unused Docker Images and Containers
              run: docker system prune -f
