version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: spot_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  backend:
    image: ghcr.io/night-pizza/spot/spot-backend:latest
    container_name: spot_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
  
  frontend:
    image: ghcr.io/night-pizza/spot/spot-frontend:latest
    container_name: spot_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      
volumes:
  db_data:
